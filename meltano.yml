version: 1
default_environment: dev
project_id: 56e0be3d-001b-4f7b-8157-268575e4db70
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-csv.git

  - name: tap-csv-1
    inherit_from: tap-csv
    config:
      files:
      - entity: order_details
        path: ./order_details.csv
        keys:
        - order_id

  - name: tap-csv-2
    inherit_from: tap-csv
    config:
      csv_files_definition: ./structure_files.json

  - name: tap-postgres
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-postgres.git
    config:
      filter_schemas:
      - public
      host: db
      port: 5432
      user: northwind_user
      database: northwind
      
  loaders:
  - name: target-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/target-csv.git
    config:
      destination_path: /data_tube
      output_path: /data_tube
  
  - name: target-postgres
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/target-postgres.git
    config:
      database: destination_db
      host: destination_db
      port: 5438
      sqlalchemy_url: postgresql://destination_db_user:destination_db_password@destination_db:5432/destination_db
      user: destination_db_user

  transformers:
  - name: dbt-postgres
    variant: dbt-labs
    pip_url: dbt-core~=1.3.0 dbt-postgres~=1.3.0
    config:
      dbname: destination_db
      host: destination_db
      port: 5432
      user: destination_db_user
      schema: tap_csv_2
